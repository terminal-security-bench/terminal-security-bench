; Managed service template for the Win3.11 VNC appliance (supervisor include).
; Wires VNC :1 (5901), the QEMU monitor socket, and external/programmatic keyboard control.
; Install with: make -f /app/deploy/win311.mk provision

[program:win311-provision]
command=/usr/local/bin/qemu-vnc-provision --vnc :1 --monitor /tmp/qemu-monitor.sock --image /app/isos/win311.img
autostart=true
autorestart=true
startsecs=0
