[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-analyzer-modern"
version = "1.0"
# Vetted Py3 replacements for the broken 2.7 pins (numpy 1.14.5 / scipy 1.1.0 / pandas 0.23.4 ...).
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.7"]
