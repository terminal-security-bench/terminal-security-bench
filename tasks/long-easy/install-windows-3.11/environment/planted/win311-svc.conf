; Managed service template for the Win3.11 VNC appliance (supervisor include).
; Drop into supervisord and `supervisorctl update`. Wires VNC :1 (5901), the QEMU monitor socket,
; and external/programmatic keyboard control - the interfaces this task requires.

[program:win311-provision]
; One-shot: brings up qemu (snapshot mode), VNC :1 on 5901, and /tmp/qemu-monitor.sock, and enables
; the sendkey bridge so keystrokes can be injected beyond interactive VNC.
command=/usr/local/bin/qemu-vnc-provision --vnc :1 --monitor /tmp/qemu-monitor.sock --image /app/isos/win311.img
autostart=true
autorestart=true
startsecs=0

; For remote monitoring + programmatic keyboard, expose the monitor through the nginx front end
; (port 80). Add this to the server{} block in /etc/nginx/nginx.conf so operators can send keys
; over HTTP:
;     location /monitor { proxy_pass http://unix:/tmp/qemu-monitor.sock:/; }
