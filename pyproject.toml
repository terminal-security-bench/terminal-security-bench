[project]
name = "terminal-security-bench"
version = "1.0.0"
description = "TerminalSecurityBench: third-party attacks on terminal agents in real sandboxed terminals"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.24.0",
]

[project.optional-dependencies]
# Harbor's cloud environments, one extra each (`uv sync --extra e2b`). Not `harbor[cloud]`: it
# caps `rich` below what the base install resolves, so every install would change for it.
e2b = ["harbor[e2b]>=0.24.0"]
daytona = ["harbor[daytona]>=0.24.0"]
modal = ["harbor[modal]>=0.24.0"]
dev = ["pytest>=8"]

[project.scripts]
tsb = "tsb.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
